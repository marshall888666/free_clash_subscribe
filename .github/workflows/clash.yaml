name: Sync latest upstream nodes

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"

permissions:
  contents: write

concurrency:
  group: sync-upstream-files
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout current repo
        uses: actions/checkout@v4

      - name: Sync files from secret map
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SYNC_MAP: ${{ secrets.SYNC_MAP }}
        run: |
          python <<'PY'
          import json
          import os
          import pathlib
          import re
          import urllib.request

          raw = os.environ.get("SYNC_MAP", "").strip()
          if not raw:
              raise SystemExit("SYNC_MAP secret is empty")

          sync_map = json.loads(raw)
          if not isinstance(sync_map, list) or not sync_map:
              raise SystemExit("SYNC_MAP must be a non-empty JSON array")

          token = os.environ.get("GITHUB_TOKEN", "")
          headers = {
              "User-Agent": "marshall888666-free-clash-subscribe",
              "Accept": "application/vnd.github+json",
          }
          if token:
              headers["Authorization"] = f"Bearer {token}"

          def download(url):
              req = urllib.request.Request(
                  url,
                  headers={"User-Agent": "marshall888666-free-clash-subscribe"},
              )
              with urllib.request.urlopen(req, timeout=60) as resp:
                  return resp.read()

          def list_repo(repo):
              url = f"https://api.github.com/repos/{repo}/contents/"
              req = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(req, timeout=30) as resp:
                  return json.loads(resp.read().decode())

          def latest_file(items, pattern):
              compiled = re.compile(pattern)
              candidates = []
              for item in items:
                  if item.get("type") != "file":
                      continue
                  match = compiled.match(item.get("name", ""))
                  if not match:
                      continue
                  if int(item.get("size") or 0) <= 0:
                      continue
                  sort_key = match.group(1) if match.lastindex else item["name"]
                  candidates.append((sort_key, item))
              if not candidates:
                  return None
              candidates.sort(key=lambda x: x[0], reverse=True)
              return candidates[0][1]

          def write_if_changed(path, data):
              target = pathlib.Path(path)
              target.parent.mkdir(parents=True, exist_ok=True)
              old = target.read_bytes() if target.exists() else None
              if old == data:
                  return False
              target.write_bytes(data)
              return True

          sources = []
          changed = []

          for item in sync_map:
              target = item.get("target")
              if not target:
                  raise SystemExit("Each SYNC_MAP item needs target")

              if item.get("repo") and item.get("pattern"):
                  latest = latest_file(list_repo(item["repo"]), item["pattern"])
                  if latest is None:
                      raise SystemExit(
                          f"No matching non-empty file in {item['repo']} for {item['pattern']}"
                      )
                  data = download(latest["download_url"])
                  source_name = f"{item['repo']}/{latest['name']}"
              elif item.get("url"):
                  data = download(item["url"])
                  source_name = item["url"]
              else:
                  raise SystemExit(
                      "Each SYNC_MAP item needs repo+pattern or url"
                  )

              if not data.strip():
                  raise SystemExit(f"Downloaded empty content for {target}")

              if write_if_changed(target, data):
                  changed.append(f"{target} <- {source_name}")
              sources.append(source_name)

          print("Using:", ", ".join(sources))

          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as f:
              f.write(f"SOURCE_FILES={' + '.join(sources)}\n")
              if changed:
                  f.write("HAS_CHANGES=true\n")
                  f.write("CHANGED_FILES<<EOF\n")
                  f.write("\n".join(changed) + "\n")
                  f.write("EOF\n")
              else:
                  f.write("HAS_CHANGES=false\n")
          PY

      - name: Commit and push
        if: env.HAS_CHANGES == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "sync: update upstream files"
          git push

      - name: Show result
        run: |
          echo "source=${SOURCE_FILES}"
          echo "has_changes=${HAS_CHANGES}"
          echo "$CHANGED_FILES"
